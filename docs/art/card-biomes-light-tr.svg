<text x="28" y="214" class="t" font-size="21" font-weight="800" fill="#15201B">Dokuz biyom</text>
<text x="28" y="238" class="t" font-size="16" fill="#4B5852">Her biri kendi yükseklik fonksiyonu. Birkaçını aç,</text><text x="28" y="260" class="t" font-size="16" fill="#4B5852">birbirine karışsınlar; ağırlık kaplayacağı yeri</text><text x="28" y="282" class="t" font-size="16" fill="#4B5852">belirler.</text>
